name: GEIVIA Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'

permissions:
  contents: read

jobs:
  release:
    name: Build and verify GEIVIA update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Require signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.GEIVIA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GEIVIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GEIVIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GEIVIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing GEIVIA_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing GEIVIA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing GEIVIA_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing GEIVIA_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/geivia-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/geivia-signing/geivia-release.jks"
          test -s "$RUNNER_TEMP/geivia-signing/geivia-release.jks"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "::error::Android sdkmanager not found under $ANDROID_HOME"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build signed release APK
        env:
          GEIVIA_KEYSTORE_FILE: ${{ runner.temp }}/geivia-signing/geivia-release.jks
          GEIVIA_KEYSTORE_PASSWORD: ${{ secrets.GEIVIA_KEYSTORE_PASSWORD }}
          GEIVIA_KEY_ALIAS: ${{ secrets.GEIVIA_KEY_ALIAS }}
          GEIVIA_KEY_PASSWORD: ${{ secrets.GEIVIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify package, version and signing certificate
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.geivia.app' versionCode='15' versionName='1.1.4'"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' | tr -d ':')"
          EXPECTED="949cea4f465b3bf42e04c8d8792e470da7c5a6b5c379361003eddc32112d272c"
          test "$CERT" = "$EXPECTED" || { echo "::error::Release certificate fingerprint mismatch"; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: GEIVIA-1.1.4-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
