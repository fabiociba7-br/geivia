name: GEIVIA Android Build

# Pull requests validate changes; pushes to main produce the signed release APK.
# workflow_dispatch remains available for explicitly requested rebuilds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: geivia-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify GEIVIA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          # Retry transient/corrupt NDK downloads and clear incomplete SDK archives.
          ndk_installed=false
          for attempt in 1 2 3; do
            if sdkmanager --install "ndk;27.2.12479018"; then
              ndk_installed=true
              break
            fi
            echo "NDK download/install attempt $attempt failed; clearing incomplete package cache."
            rm -rf "$ANDROID_HOME/ndk/27.2.12479018" "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          if [ "$ndk_installed" != true ]; then
            echo "NDK installation failed after three attempts."
            exit 1
          fi
          sdkmanager --install "cmake;3.22.1"

      - name: Validate Android permission policy
        run: node scripts/validate-android-permissions.mjs

      - name: Validate Linux toolchain manifest
        run: node scripts/validate-linux-toolchain.mjs

      - name: Validate GitHub OAuth Worker syntax
        run: |
          node --check github-auth-worker/src/index.js
          npm test --prefix github-auth-worker

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Compile on-device Linux smoke test
        run: gradle --no-daemon assembleDebugAndroidTest

      - name: Build debug APK for CI validation
        run: gradle --no-daemon assembleDebug

      # Pull requests from forks do not receive repository secrets. They run
      # tests above, but only trusted main/manual builds produce installable APKs.
      - name: Validate release signing secrets
        if: github.event_name != 'pull_request'
        env:
          GEIVIA_KEYSTORE_BASE64: ${{ secrets.GEIVIA_KEYSTORE_BASE64 }}
          GEIVIA_KEYSTORE_PASSWORD: ${{ secrets.GEIVIA_KEYSTORE_PASSWORD }}
          GEIVIA_KEY_ALIAS: ${{ secrets.GEIVIA_KEY_ALIAS }}
          GEIVIA_KEY_PASSWORD: ${{ secrets.GEIVIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GEIVIA_KEYSTORE_BASE64" || { echo "Missing GEIVIA_KEYSTORE_BASE64"; exit 1; }
          test -n "$GEIVIA_KEYSTORE_PASSWORD" || { echo "Missing GEIVIA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$GEIVIA_KEY_ALIAS" || { echo "Missing GEIVIA_KEY_ALIAS"; exit 1; }
          test -n "$GEIVIA_KEY_PASSWORD" || { echo "Missing GEIVIA_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/geivia-signing"
          printf '%s' "$GEIVIA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/geivia-signing/geivia-release.jks"
          test -s "$RUNNER_TEMP/geivia-signing/geivia-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/geivia-signing/geivia-release.jks" \
            -storepass "$GEIVIA_KEYSTORE_PASSWORD" -alias "$GEIVIA_KEY_ALIAS" >/dev/null
          ACTUAL_CERT_SHA256="$(keytool -list -v -keystore "$RUNNER_TEMP/geivia-signing/geivia-release.jks" \
            -storepass "$GEIVIA_KEYSTORE_PASSWORD" -alias "$GEIVIA_KEY_ALIAS" \
            | awk '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          EXPECTED_CERT_SHA256="949CEA4F465B3BF42E04C8D8792E470DA7C5A6B5C379361003EDDC32112D272C"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Release keystore certificate fingerprint mismatch. Refusing to build."
            exit 1
          fi

      - name: Build permanently signed release APK
        if: github.event_name != 'pull_request'
        env:
          GEIVIA_KEYSTORE_FILE: ${{ runner.temp }}/geivia-signing/geivia-release.jks
          GEIVIA_KEYSTORE_PASSWORD: ${{ secrets.GEIVIA_KEYSTORE_PASSWORD }}
          GEIVIA_KEY_ALIAS: ${{ secrets.GEIVIA_KEY_ALIAS }}
          GEIVIA_KEY_PASSWORD: ${{ secrets.GEIVIA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature and certificate
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          APK_CERT_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print toupper($2); exit}')"
          EXPECTED_CERT_SHA256="949CEA4F465B3BF42E04C8D8792E470DA7C5A6B5C379361003EDDC32112D272C"
          if [ "$APK_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "APK certificate fingerprint mismatch. Refusing to publish."
            exit 1
          fi
          echo "APK signature verified. Certificate SHA-256: $APK_CERT_SHA256"

      - name: Upload permanently signed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: geivia-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
